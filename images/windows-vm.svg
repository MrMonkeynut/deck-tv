<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B2A4A"/><stop offset="1" stop-color="#05090F"/>
    </linearGradient>
    <radialGradient id="halo" cx="240" cy="262" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3AA0FF" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#3AA0FF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3AA0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="640" fill="url(#bg)"/>
  <rect width="480" height="640" fill="url(#halo)"/>
  <!-- Faint stacked app windows, for a PC desktop -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <rect x="34" y="70" width="150" height="100" rx="10" stroke-opacity=".10" stroke-width="2.5"/>
    <path d="M34 92h150" stroke-opacity=".10" stroke-width="2.5"/>
    <rect x="300" y="470" width="150" height="100" rx="10" stroke-opacity=".10" stroke-width="2.5"/>
    <path d="M300 492h150" stroke-opacity=".10" stroke-width="2.5"/>
    <rect x="326" y="444" width="150" height="100" rx="10" stroke-opacity=".05" stroke-width="2"/>
    <circle cx="240" cy="262" r="150" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="240" cy="262" r="205" stroke-opacity="0.05" stroke-width="2"/>
  </g>
</svg>
