<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A1418"/><stop offset="1" stop-color="#0B0607"/>
    </linearGradient>
    <radialGradient id="halo" cx="240" cy="262" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2542D" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#F2542D" stop-opacity=".16"/>
      <stop offset="1" stop-color="#F2542D" stop-opacity="0"/>
