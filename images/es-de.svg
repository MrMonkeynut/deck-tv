    <rect x="422" y="500" width="18" height="18" fill-opacity=".05"/>
    <rect x="422" y="478" width="18" height="18" fill-opacity=".04"/>
  </g>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 540h30v-30h30v30h30v30h-30v30h-30v-30h-30z" stroke-opacity=".10" stroke-width="2.5"/>
    <circle cx="350" cy="120" r="16" stroke-opacity=".10" stroke-width="2.5"/>
    <circle cx="390" cy="96" r="16" stroke-opacity=".08" stroke-width="2.5"/>
